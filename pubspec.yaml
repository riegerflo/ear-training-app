name: ear_training_app
description: An ear training app for musicians to practice intervals, chords, and scales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Storage
  shared_preferences: ^2.3.0

  # Audio
  just_audio: ^0.9.42

  # UI
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/audio/

